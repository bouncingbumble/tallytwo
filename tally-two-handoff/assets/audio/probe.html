<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tally Two audio probe</title>
<!--
  The step -1 go/no-go from WEB-PLAN §5: can this browser decode the pack's audio with Web Audio?
  Serve this folder (cd tally-two-handoff/assets/audio && python3 -m http.server 8000) and open
  http://<mac-ip>:8000/probe.html on the iPhone (same Wi-Fi). Tap the button. Four lines print:
  ogg SFX / ogg music / m4a SFX / m4a music — "ok <duration>s" or "fail <error>".
  The web build ships the .m4a files because Vorbis in iOS Safari was unverified; if both ogg
  lines say ok on the target phone, the .ogg originals could be wired instead.
-->
<style>
  body { font: 16px -apple-system, sans-serif; padding: 24px; background: #241408; color: #f2e8d5; }
  button { font: inherit; padding: 12px 18px; }
  pre { white-space: pre-wrap; }
</style>
<button id="go">Probe audio decoding</button>
<pre id="out"></pre>
<script>
  const files = [
    ["ogg SFX", "sfx/SFX_DeckShuffle01.ogg"],
    ["ogg music", "music/ost_1_-_saloon_stare_down_loop.ogg"],
    ["m4a SFX", "m4a/sfx/SFX_DeckShuffle01.m4a"],
    ["m4a music", "m4a/music/ost_1.m4a"],
  ];
  const out = document.getElementById("out");
  document.getElementById("go").onclick = async () => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    out.textContent = "context state: " + ctx.state + "\n";
    for (const [name, path] of files) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const buf = await ctx.decodeAudioData(await res.arrayBuffer());
        out.textContent += name + ": ok " + buf.duration.toFixed(3) + "s, " + buf.numberOfChannels + "ch, " + buf.sampleRate + "Hz\n";
      } catch (e) {
        out.textContent += name + ": fail " + (e && e.message ? e.message : e) + "\n";
      }
    }
  };
</script>
